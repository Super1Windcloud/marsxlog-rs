[package]
name    = "oh-xlog"
version = "0.1.7"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[features]
default = ["rust-backend"]
rust-backend = ["mars-xlog/rust-backend"]

[dependencies]
mars-xlog = { path = "../xlog", version = "0.1.7", default-features = false, features = ["tracing"] }
napi-ohos = { version = "1.0", default-features = false, features = [
    "napi8",
    "async",
] }
napi-derive-ohos = { version = "1.0" }

[build-dependencies]
napi-build-ohos = { version = "1.0" }
