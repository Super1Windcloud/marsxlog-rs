[package]
name = "xlog-decoder"
version = "0.1.5"
edition = "2021"
license = "MIT"
description = "Command-line decoder for Tencent Mars xlog files, log directories, and Feedback diagnostic ZIP archives."
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/xlog-decoder"
keywords = ["logging", "xlog", "decoder", "cli", "mars"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "xlog_decoder"
path = "src/lib.rs"

[[bin]]
name = "xlog-decoder"
path = "src/bin/xlog-decoder.rs"

[[bin]]
name = "mars-xlog"
path = "src/bin/mars-xlog.rs"

[dependencies]
flate2 = "1"
zstd = "0.13"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = { workspace = true }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdh"] }
rand_core = "0.6"
walkdir = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
